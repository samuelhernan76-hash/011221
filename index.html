<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Valeria ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#ffd6e7,#fff0f5);
        overflow:hidden;
        font-family:'Montserrat',sans-serif;
    }

    /* TARJETA */
    .card{
        width:90%;
        max-width:520px;
        background:rgba(255,255,255,0.96);
        padding:45px 35px;
        border-radius:28px;
        text-align:center;
        box-shadow:0 15px 40px rgba(255,77,136,0.25);
        animation:float 4s ease-in-out infinite;
        z-index:2;
        backdrop-filter:blur(6px);
    }

    @keyframes float{
        0%{transform:translateY(0);}
        50%{transform:translateY(-8px);}
        100%{transform:translateY(0);}
    }

    /* TEXTO PRINCIPAL */
    .text{
        font-family:'Dancing Script',cursive;
        font-size:42px;
        line-height:1.4;
        color:#c73263;
        text-shadow:0 4px 10px rgba(255,77,136,0.15);
    }

    /* TEXTO AMOR */
    .love{
        margin-top:25px;
        font-family:'Montserrat',sans-serif;
        font-size:28px;
        font-weight:700;
        color:#ff4d88;
        letter-spacing:1px;
    }

    /* CORAZÓN MÁS PEQUEÑO */
    .heart{
        width:85px;
        height:85px;
        margin:35px auto 0;
        position:relative;
        transform:rotate(-45deg);
        animation:pulse 1.5s infinite;
    }

    .heart::before,
    .heart::after{
        content:"";
        position:absolute;
        width:85px;
        height:85px;
        background:#ff4d88;
        border-radius:50%;
    }

    .heart::before{
        top:-42px;
        left:0;
    }

    .heart::after{
        left:42px;
        top:0;
    }

    .heart-main{
        width:85px;
        height:85px;
        background:#ff4d88;
        position:absolute;
    }

    @keyframes pulse{
        0%{
            transform:rotate(-45deg) scale(1);
        }
        50%{
            transform:rotate(-45deg) scale(1.1);
        }
        100%{
            transform:rotate(-45deg) scale(1);
        }
    }

    /* CORAZONES FLOTANTES */
    .floating-heart{
        position:absolute;
        color:rgba(255,77,136,0.3);
        animation:up linear infinite;
        user-select:none;
    }

    @keyframes up{
        from{
            transform:translateY(100vh);
            opacity:0;
        }

        10%{
            opacity:1;
        }

        to{
            transform:translateY(-120vh);
            opacity:0;
        }
    }

</style>
</head>

<body>

<!-- TARJETA -->
<div class="card">

    <div class="text">
        JUNTOS POR Y PARA SIEMPRE<br>
        QUE NADA NI NADIE NOS SEPARE
    </div>

    <div class="love">
        TE AMOOOO MUCHOOO MI VALERIA ❤️
    </div>

    <!-- CORAZÓN -->
    <div class="heart">
        <div class="heart-main"></div>
    </div>

</div>

<script>

    // Corazones flotando
    for(let i=0;i<25;i++){

        const heart = document.createElement("div");

        heart.classList.add("floating-heart");

        heart.innerHTML = "❤";

        heart.style.left = Math.random()*100 + "vw";

        heart.style.fontSize = (15 + Math.random()*40) + "px";

        heart.style.animationDuration = (5 + Math.random()*10) + "s";

        heart.style.animationDelay = Math.random()*5 + "s";

        document.body.appendChild(heart);
    }

</script>

</body>
</html>
